<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>

    </header>
    <main>
        




            <h1>Bienvenido a HistoryShop</h1>

            <h2>Porfavor ingrese sus datos</h2>

            <form action="Registrarse.html" method="post">

                <div>
                    <input type="text" name="nombre" placeholder="Nombre">
                </div>

                <div>
                    <input type="text" name="apellido" placeholder="Apellido">
                </div>

                <div>
                    <input type="text" name="usuario" placeholder="Nombre del usuario">
                </div>

                <div>
                    <input type="password" name="contraseña" placeholder="Contraseña">
                </div>

                <div>
                    <input type="password" name="confirmar_contraseña" placeholder="Confirmar contraseña">
                </div>

                <div>
                    <input type="email" name="correo_electronico" placeholder="Correo electronico">
                </div>

                <div>
                    <input type="date" name="fecha_nacimiento">
                </div>

                <div>
                    <input type="tel" name="telefono" placeholder="Telefono">
                </div>

                <div>
                    <input type="text" name="genero" placeholder="Genero">
                </div>

                <div>
                    <input type="text" name="pais" placeholder="Pais de residencia">
                </div>

                <div>
                    <input type="text" name="ciudad" placeholder="Ciudad de residencia">
                </div>

                <div>
                    <label>
                        <input type="checkbox">
                        Acepto los términos y condiciones
                    </label>
                </div>

                <div>
                    <input type="submit" value="Registrarse">
                </div>

            </form>

        
    </main>
    <footer></footer>
